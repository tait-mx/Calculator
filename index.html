<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
<script mode="module" src="script.js" defer></script>
<link rel="stylesheet" href="style.css"></link>
</head>
<body>
  <div class = "container">

    <input type="text" value="0">

    <div class = "numberContainer">

      <div class = "clearRow">
        <button id = "clear" type="button">CE</button>
        <button id = "root" type="button">√x</button>
        <button id = "percent" type="button">%</button>
        <button id = "mul" type="button">*</button>
       </div>

      <div class = "numberRow">
        <button id = "but7" type="button">7</button>
        <button id = "but8" type="button">8</button>
        <button id = "but9" type="button">9</button>
        <button id = "div" type="button">/</button>
       </div>
      

      <div class = "numberRow">
        <button id = "but4" type="button">4</button>
        <button id = "but5" type="button">5</button>
        <button id = "but6" type="button">6</button>
        <button id = "add" type="button">+</button>
      </div>

      <div class = "numberRow">
        <button id = "but1" type="button">1</button>
        <button id = "but2" type="button">2</button>
        <button id = "but3" type="button">3</button>
        <button id = "sub" type="button">-</button>
      </div>

      <div class = "lastRow">
        <button id = "butSign" type="button">+/-</button>
        <button id = "but0" type="button">0</button>
        <button id = "butPoint" type="button">.</button>
        <button id = "equal" type="button">=</button>
      </div>
    </div>

    </div>




  </div>
  

</body>
</html>
