<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
<script mode="module" src="script.js" defer></script>
<link rel="stylesheet" href="style.css"></link>
</head>
<body>
  <div class = "container">

    <input type="text" value="0">

    <div class = "numberContainer">

      
      <button id = "bkSpace" type="button"></button>

      <div class = "clearRow">
        <button id = "clear" type="button">CE</button>
        <button id = "root" type="button">√x</button>
        <button id = "percent" type="button">%</button>
        <button id = "mul" type="button">*</button>
       </div>

      <div class = "numberRow">
        <button class="numButton" id = "but07" type="button">7</button>
        <button class="numButton" id = "but08" type="button">8</button>
        <button class="numButton" id = "but09" type="button">9</button>
        <button id = "div" type="button">/</button>
       </div>
      
      <div class = "numberRow">
        <button class="numButton" id = "but04" type="button">4</button>
        <button class="numButton" id = "but05" type="button">5</button>
        <button class="numButton" id = "but06" type="button">6</button>
        <button id = "add" type="button">+</button>
      </div>

      <div class = "numberRow">
        <button class="numButton" id = "but01" type="button">1</button>
        <button class="numButton" id = "but02" type="button">2</button>
        <button class="numButton" id = "but03" type="button">3</button>
        <button id = "sub" type="button">-</button>
      </div>

      <div class = "lastRow">
        <button id = "sign" type="button">+/-</button>
        <button class="numButton" id = "but00" type="button">0</button>
        <button id = "point" type="button">.</button>
        <button id = "equal" type="button">=</button>
      </div>
    </div>

    </div>




  </div>
  

</body>
</html>
